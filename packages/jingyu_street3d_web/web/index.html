<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="color-scheme" content="light dark">
<title>3D 街区</title>
<!-- Everything loads from this package (no CDN). OrbitControls.js imports the bare specifier 'three'. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f2; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font: 15px/1.5 system-ui, -apple-system, "Noto Sans SC", "PingFang SC", sans-serif; color: #2d3b48; }
  body.theme-dark { background: #121a24; color: #d3dde8; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }
  #notice { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 32px; text-align: center; pointer-events: none; }
  #notice[hidden] { display: none; }
  #overview { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 2;
    padding: 8px 18px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: #2d3b48;
    font: 600 15px/1.2 system-ui, -apple-system, "Noto Sans SC", "PingFang SC", sans-serif;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); }
  #overview[hidden] { display: none; }
  body.theme-dark #overview { background: rgba(30, 40, 54, 0.92); color: #d3dde8; }
</style>
</head>
<body>
<div id="stage" aria-label="3D 街区"></div>
<div id="notice" role="status" hidden></div>
<button id="overview" type="button" hidden>全景</button>
<script type="module" src="./src/main.js"></script>
</body>
</html>
