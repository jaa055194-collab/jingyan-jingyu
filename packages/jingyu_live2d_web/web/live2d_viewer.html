<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live2D Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #stage { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script src="runtime/purismcore/purismcore.js"></script>
    <!-- Texture budget (window.Live2DTextureBudget) must load before the
         renderer: prepare() uses it to fit textures into phone GPU memory. -->
    <script src="live2d_texture_budget.js"></script>
    <!-- Animation modules load before the protocol layer so a model load can
         compile its staged motion3/exp3 files and start the frame pipeline. -->
    <script src="live2d_motion.js"></script>
    <script src="live2d_behavior.js"></script>
    <script src="live2d_physics.js"></script>
    <script src="live2d_pose.js"></script>
    <!-- WebGL renderer adapter must load before the protocol layer so that
         window.Live2DRenderer exists when the viewer starts drawing. -->
    <script src="live2d_renderer_webgl.js"></script>
    <script src="live2d_viewer.js"></script>
  </body>
</html>
